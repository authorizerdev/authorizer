# OpenSSF Scorecard workflow
#
# Drop this at .github/workflows/scorecard.yml in the main repo
# (and any sibling repos you want scored separately).
#
# After first successful run, results appear under the repo's Security tab → Code scanning.
# README badge: https://securityscorecards.dev/viewer/?uri=github.com/authorizerdev/authorizer
# 3. Publishing to the public Scorecard API requires `publish_results: true`
#    and a one-time opt-in by registering the repo at https://securityscorecards.dev/

name: Scorecard supply-chain security

# Scorecard only supports the repository's default branch. Release/tag events
# check out a tag ref and fail with "only default branch is supported", so we
# trigger on the OSSF-recommended events instead: pushes to the default branch,
# a weekly schedule, and branch-protection-rule changes.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays at 07:20 UTC.
    - cron: '20 7 * * 1'
  branch_protection_rule:

# Top-level read-all permissions; jobs override what they need.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required for OIDC token used by Scorecard for public publishing.
      id-token: write
      # Read-only, needed by Scorecard checks.
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Set to true to publish results to https://securityscorecards.dev
          # (the badge in README points at this endpoint).
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

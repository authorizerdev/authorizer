---
name: govulncheck

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - "**/*.go"
      - .govulncheck-allow
      - scripts/govulncheck.sh
      - .github/workflows/govulncheck.yml
  push:
    branches: [main]
  schedule:
    - cron: "33 2 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Not golang/govulncheck-action: it has no allowlist, so one finding we
      # cannot act on leaves this check permanently red. scripts/govulncheck.sh
      # fails on any reachable finding that .govulncheck-allow does not list,
      # with a written reason. `make vulncheck` runs the same script.
      - name: Run govulncheck
        run: make vulncheck
